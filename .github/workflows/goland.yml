name: Auto GoLand Release

on:
  schedule:
    - cron: "0 3 * * *"   # раз в сутки (03:00 UTC)
  workflow_dispatch:
    inputs:
      force_update:
        description: Update an existing release with the latest assets
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest GoLand version metadata
        id: meta
        run: |
          curl -s \
            "https://data.services.jetbrains.com/products/releases?code=GO&latest=true&type=release" \
            > meta.json

          VERSION=$(jq -r '.GO[0].version' meta.json)
          URL_ARM=$(jq -r '.GO[0].downloads.macM1.link' meta.json)
          URL_INTEL=$(jq -r '.GO[0].downloads.mac.link' meta.json)

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to detect version"
            exit 1
          fi

          if [ -z "$URL_ARM" ] || [ "$URL_ARM" = "null" ]; then
            echo "Failed to detect macOS Apple Silicon download URL"
            cat meta.json
            exit 1
          fi

          if [ -z "$URL_INTEL" ] || [ "$URL_INTEL" = "null" ]; then
            echo "Failed to detect macOS Intel download URL"
            cat meta.json
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "url_arm=$URL_ARM" >> $GITHUB_OUTPUT
          echo "url_intel=$URL_INTEL" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        run: |
          TAG="goland-${{ steps.meta.outputs.version }}"

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if release already exists
        if: steps.check.outputs.exists == 'true' && github.event.inputs.force_update != 'true'
        run: |
          echo "Release already exists, skipping."

      - name: Download GoLand DMGs
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force_update == 'true'
        run: |
          mkdir -p work
          curl -L \
            -o work/goland-${{ steps.meta.outputs.version }}-aarch64.dmg \
            "${{ steps.meta.outputs.url_arm }}"
          curl -L \
            -o work/goland-${{ steps.meta.outputs.version }}-x64.dmg \
            "${{ steps.meta.outputs.url_intel }}"

      - name: Calculate SHA256
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force_update == 'true'
        run: |
          shasum -a 256 work/goland-${{ steps.meta.outputs.version }}-*.dmg \
            > work/SHA256.txt

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: goland-${{ steps.meta.outputs.version }}
          name: GoLand ${{ steps.meta.outputs.version }}
          body: |
            Automated release of GoLand ${{ steps.meta.outputs.version }}

            Platforms: macOS (Apple Silicon, Intel)
            SHA256 checksums attached.
          files: |
            work/goland-${{ steps.meta.outputs.version }}-aarch64.dmg
            work/goland-${{ steps.meta.outputs.version }}-x64.dmg
            work/SHA256.txt

  release-pycharm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest PyCharm version metadata
        id: meta
        run: |
          curl -s \
            "https://data.services.jetbrains.com/products/releases?code=PCP&latest=true&type=release" \
            > meta.json
          
          VERSION=$(jq -r '.PCP[0].version' meta.json)
          URL_ARM=$(jq -r '.PCP[0].downloads.macM1.link' meta.json)
          URL_INTEL=$(jq -r '.PCP[0].downloads.mac.link' meta.json)
          
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to detect version"
            exit 1
          fi
          
          if [ -z "$URL_ARM" ] || [ "$URL_ARM" = "null" ]; then
            echo "Failed to detect macOS Apple Silicon download URL"
            cat meta.json
            exit 1
          fi

          if [ -z "$URL_INTEL" ] || [ "$URL_INTEL" = "null" ]; then
            echo "Failed to detect macOS Intel download URL"
            cat meta.json
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "url_arm=$URL_ARM" >> $GITHUB_OUTPUT
          echo "url_intel=$URL_INTEL" >> $GITHUB_OUTPUT



      - name: Check if release exists
        id: check
        run: |
          TAG="pycharm-${{ steps.meta.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download PyCharm DMGs
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force_update == 'true'
        run: |
          mkdir -p work
          curl -L \
            -o work/pycharm-${{ steps.meta.outputs.version }}-aarch64.dmg \
            "${{ steps.meta.outputs.url_arm }}"
          curl -L \
            -o work/pycharm-${{ steps.meta.outputs.version }}-x64.dmg \
            "${{ steps.meta.outputs.url_intel }}"

      - name: Calculate SHA256
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force_update == 'true'
        run: |
          shasum -a 256 work/pycharm-${{ steps.meta.outputs.version }}-*.dmg \
            > work/SHA256.txt

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pycharm-${{ steps.meta.outputs.version }}
          name: PyCharm ${{ steps.meta.outputs.version }}
          body: |
            Automated release of PyCharm ${{ steps.meta.outputs.version }}

            Platforms: macOS (Apple Silicon, Intel)
            SHA256 checksums attached.
          files: |
            work/pycharm-${{ steps.meta.outputs.version }}-aarch64.dmg
            work/pycharm-${{ steps.meta.outputs.version }}-x64.dmg
            work/SHA256.txt

  release-clion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest CLion version metadata
        id: meta
        run: |
          curl -s \
            "https://data.services.jetbrains.com/products/releases?code=CL&latest=true&type=release" \
            > meta.json

          VERSION=$(jq -r '.CL[0].version' meta.json)
          URL_ARM=$(jq -r '.CL[0].downloads.macM1.link' meta.json)
          URL_INTEL=$(jq -r '.CL[0].downloads.mac.link' meta.json)

          test -n "$VERSION" && test "$VERSION" != "null" || {
            echo "Failed to detect version"; exit 1;
          }
          test -n "$URL_ARM" && test "$URL_ARM" != "null" || {
            echo "Failed to detect macOS Apple Silicon download URL"; cat meta.json; exit 1;
          }
          test -n "$URL_INTEL" && test "$URL_INTEL" != "null" || {
            echo "Failed to detect macOS Intel download URL"; cat meta.json; exit 1;
          }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url_arm=$URL_ARM" >> "$GITHUB_OUTPUT"
          echo "url_intel=$URL_INTEL" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check
        run: |
          TAG="clion-${{ steps.meta.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download CLion DMGs
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force_update == 'true'
        run: |
          mkdir -p work
          curl -fL \
            -o work/clion-${{ steps.meta.outputs.version }}-aarch64.dmg \
            "${{ steps.meta.outputs.url_arm }}"
          curl -fL \
            -o work/clion-${{ steps.meta.outputs.version }}-x64.dmg \
            "${{ steps.meta.outputs.url_intel }}"

      - name: Calculate SHA256
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force_update == 'true'
        run: |
          shasum -a 256 work/clion-${{ steps.meta.outputs.version }}-*.dmg \
            > work/SHA256.txt

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clion-${{ steps.meta.outputs.version }}
          name: CLion ${{ steps.meta.outputs.version }}
          body: |
            Automated release of CLion ${{ steps.meta.outputs.version }}

            Platforms: macOS (Apple Silicon, Intel)
            SHA256 checksums attached.
          files: |
            work/clion-${{ steps.meta.outputs.version }}-aarch64.dmg
            work/clion-${{ steps.meta.outputs.version }}-x64.dmg
            work/SHA256.txt
